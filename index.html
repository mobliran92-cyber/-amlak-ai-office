<!doctype html><html lang="fa" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5"><link rel="manifest" href="/manifest.json"><title>املاک هوشمند</title>
<style>
:root{--a:#4f46e5;--b:#06b6d4;--bg:#f6f7fb;--card:#fff;--text:#172033;--muted:#697386;--line:#e8ebf2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}button,input,select,textarea{font:inherit}
.top{background:linear-gradient(135deg,#4f46e5,#06b6d4);color:#fff;padding:18px 16px 22px;position:sticky;top:0;z-index:10}.topline{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:21px}.logout{border:1px solid #ffffff55;background:#ffffff20;color:white;border-radius:10px;padding:7px 10px}.sub{opacity:.82;font-size:12px;margin-top:5px}
nav{position:sticky;top:75px;z-index:9;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:7px;overflow:auto;padding:9px}nav button{border:0;background:#f0f2f7;border-radius:12px;padding:9px 13px;white-space:nowrap;color:#394150}nav button.on{background:var(--a);color:#fff}
main{max-width:1100px;margin:auto;padding:14px}.page{display:none}.page.on{display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:11px;box-shadow:0 4px 18px #18203308}.stat{background:linear-gradient(135deg,#fff,#f4f7ff)}.num{font-size:27px;font-weight:900;color:var(--a)}.muted{color:var(--muted);font-size:12px}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.wide{grid-column:1/-1}input,select,textarea{width:100%;border:1px solid #dce1ea;background:#fff;border-radius:11px;padding:11px;color:var(--text);margin:4px 0 8px}textarea{min-height:75px}.primary{border:0;border-radius:12px;padding:11px 15px;color:white;background:linear-gradient(135deg,var(--a),#6366f1);font-weight:700}.secondary{border:1px solid #dce1ea;background:white;border-radius:12px;padding:10px 14px}.item{padding:12px 0;border-bottom:1px solid var(--line)}.pill{display:inline-block;background:#eef2ff;color:#4338ca;border-radius:999px;padding:4px 8px;font-size:11px;margin:2px}.score{font-size:23px;font-weight:900;color:#059669}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eef2ff,#ecfeff)}.loginbox{width:min(430px,100%);background:white;border-radius:25px;padding:24px;box-shadow:0 20px 60px #1e1b4b18}.logo{font-size:30px;font-weight:900;color:var(--a)}.hint{font-size:12px;color:var(--muted);line-height:1.8}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><div class="logo">املاک هوشمند</div><p>دفتر املاک شما؛ سریع، ساده و قابل توسعه.</p><form id="lf"><input name="email" type="email" placeholder="ایمیل" required><input name="password" type="password" placeholder="رمز عبور" required><button class="primary" style="width:100%">ورود به دفتر</button></form><p id="le" class="hint"></p></div></div>
<div id="app" style="display:none"><header class="top"><div class="topline"><div class="brand">املاک هوشمند</div><button class="logout" onclick="logout()">خروج</button></div><div class="sub" id="who"></div></header>
<nav><button data-p="dash" class="on">داشبورد</button><button data-p="props">فایل‌های ملک</button><button data-p="clients">مشتری‌ها</button><button data-p="match">تطبیق هوشمند</button><button data-p="follow">پیگیری‌ها</button><button data-p="search">جستجو</button></nav>
<main>
<section id="dash" class="page on"><div class="grid" id="stats"></div><div class="card"><b>وضعیت امروز</b><div id="today"></div></div></section>
<section id="props" class="page"><div class="card"><b>ثبت فایل ملک</b><form id="pf"><div class="row">
<input name="title" placeholder="عنوان ملک" required><select name="purpose"><option>مسکونی</option><option>تجاری</option><option>اداری</option><option>خدماتی</option><option>کشاورزی</option><option>صنعتی</option><option>آموزشی</option><option>پزشکی</option><option>گردشگری</option><option>انبار/لجستیک</option><option>زمین</option><option>سایر</option></select>
<select name="deal"><option>فروش</option><option>خرید</option><option>رهن</option><option>اجاره</option><option>مشارکت</option><option>سرمایه‌گذاری</option><option>معاوضه</option><option>ساخت</option><option>انتقال</option><option>سایر</option></select>
<input name="city" placeholder="شهر"><input name="neighborhood" placeholder="محله"><input name="address" placeholder="آدرس" class="wide"><input name="area" type="number" placeholder="متراژ"><input name="land_area" type="number" placeholder="متراژ زمین"><input name="price" type="number" placeholder="قیمت"><input name="rent" type="number" placeholder="اجاره"><input name="deposit" type="number" placeholder="ودیعه"><input name="build_year" type="number" placeholder="سال ساخت"><input name="bedrooms" type="number" placeholder="تعداد خواب"><input name="floor" placeholder="طبقه"><input name="owner" placeholder="مالک"><input name="phone" placeholder="تلفن مالک"><input name="features" placeholder="امکانات" class="wide"><textarea name="notes" placeholder="توضیحات" class="wide"></textarea></div><button type="button" class="secondary" onclick="voice(this.form)">🎙️ ورود صوتی</button> <button class="primary">ذخیره فایل</button></form></div><div class="card"><b>فایل‌های ثبت‌شده</b><div id="plist"></div></div></section>
<section id="clients" class="page"><div class="card"><b>ثبت مشتری</b><form id="cf"><div class="row"><input name="name" placeholder="نام مشتری" required><input name="phone" placeholder="تلفن"><select name="purpose"><option>مسکونی</option><option>تجاری</option><option>اداری</option><option>خدماتی</option><option>کشاورزی</option><option>صنعتی</option><option>آموزشی</option><option>پزشکی</option><option>گردشگری</option><option>انبار/لجستیک</option><option>زمین</option><option>سایر</option></select><select name="deal"><option>خرید</option><option>فروش</option><option>رهن</option><option>اجاره</option><option>مشارکت</option><option>سرمایه‌گذاری</option><option>معاوضه</option><option>ساخت</option><option>انتقال</option><option>سایر</option></select><input name="city" placeholder="شهر"><input name="neighborhood" placeholder="محله"><input name="min_area" type="number" placeholder="حداقل متراژ"><input name="max_area" type="number" placeholder="حداکثر متراژ"><input name="min_budget" type="number" placeholder="حداقل بودجه"><input name="max_budget" type="number" placeholder="حداکثر بودجه"><input name="bedrooms" type="number" placeholder="حداقل خواب"><input name="urgency" placeholder="فوریت"><input name="must_have" placeholder="حتماً داشته باشد" class="wide"><textarea name="notes" placeholder="توضیحات" class="wide"></textarea></div><button type="button" class="secondary" onclick="voice(this.form)">🎙️ ورود صوتی</button> <button class="primary">ذخیره مشتری</button></form></div><div class="card"><b>مشتری‌های ثبت‌شده</b><div id="clist"></div></div></section>
<section id="match" class="page"><div class="card"><b>تطبیق هوشمند مشتری و فایل</b><select id="mc"></select><button class="primary" onclick="match()">اجرای تطبیق</button><div id="mout"></div></div></section>
<section id="follow" class="page"><div class="card"><b>ثبت پیگیری</b><form id="ff"><div class="row"><select name="client_id" id="fc"></select><select name="property_id" id="fp"></select><input name="title" placeholder="موضوع پیگیری" required><input name="due_at" type="datetime-local"><input name="notes" placeholder="یادداشت"></div><button class="primary">ثبت پیگیری</button></form></div><div class="card"><b>پیگیری‌های باز</b><div id="flist"></div></div></section>
<section id="search" class="page"><div class="card"><b>جستجوی سریع</b><input id="sq" placeholder="نام، محله، شهر، تلفن، ویژگی..."><div id="sout"></div></div></section>
</main></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function api(u,o){let r=await fetch(u,o);if(r.status==401){showLogin();throw Error("auth")}let j=await r.json();if(!r.ok)throw Error(j.error||"خطا");return j}
function fd(f){return Object.fromEntries(new FormData(f).entries())}
function showLogin(){$("#login").style.display="grid";$("#app").style.display="none"}
async function boot(){let m=await fetch("/api/me").then(r=>r.json());if(m){$("#login").style.display="none";$("#app").style.display="block";$("#who").textContent=m.name+" • "+m.email;load()}}
$("#lf").onsubmit=async e=>{e.preventDefault();try{await api("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(fd(e.target))});boot()}catch(x){$("#le").textContent=x.message}}
async function logout(){await fetch("/api/logout",{method:"POST"});showLogin()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on");document.querySelectorAll(".page").forEach(x=>x.classList.remove("on"));$("#"+b.dataset.p).classList.add("on");load()});
$("#pf").onsubmit=async e=>{e.preventDefault();await api("/api/properties",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(fd(e.target))});e.target.reset();load()};
$("#cf").onsubmit=async e=>{e.preventDefault();await api("/api/clients",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(fd(e.target))});e.target.reset();load()};
$("#ff").onsubmit=async e=>{e.preventDefault();await api("/api/followups",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(fd(e.target))});e.target.reset();load()};
function voice(form){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert("ورود صوتی در این مرورگر در دسترس نیست.");let r=new SR();r.lang="fa-IR";r.interimResults=false;r.onresult=e=>{let t=e.results[0][0].transcript,n=form.querySelector("textarea");if(n)n.value+=(n.value?" ":"")+t};r.start()}
async function load(){try{let [d,p,c,f]=await Promise.all([api("/api/dashboard"),api("/api/properties"),api("/api/clients"),api("/api/followups")]);$("#stats").innerHTML=[["فایل فعال",d.properties],["مشتری",d.clients],["پیگیری باز",d.openFollowups],["پیگیری امروز",d.todayFollowups]].map(x=>`<div class="card stat"><div class=muted>${x[0]}</div><div class=num>${x[1]}</div></div>`).join("");$("#today").innerHTML=d.todayFollowups?`امروز ${d.todayFollowups} پیگیری داری.`:"برای امروز پیگیری ثبت نشده.";$("#plist").innerHTML=p.slice(0,50).map(x=>`<div class=item><b>${esc(x.title)}</b> <span class=pill>${esc(x.purpose)}</span><span class=pill>${esc(x.deal)}</span><br>${esc(x.city)} ${esc(x.neighborhood)} • ${x.area||"-"} متر • ${esc(x.phone||"")}</div>`).join("")||"هنوز فایلی ثبت نشده.";$("#clist").innerHTML=c.slice(0,50).map(x=>`<div class=item><b>${esc(x.name)}</b> • ${esc(x.phone||"")}<br>${esc(x.city)} ${esc(x.neighborhood)} • بودجه ${x.min_budget||"-"} تا ${x.max_budget||"-"}</div>`).join("")||"هنوز مشتری ثبت نشده.";$("#mc").innerHTML=c.map(x=>`<option value=${x.id}>${esc(x.name)} • ${esc(x.phone||"")}</option>`).join("");$("#fc").innerHTML="<option value=''>بدون مشتری</option>"+c.map(x=>`<option value=${x.id}>${esc(x.name)}</option>`).join("");$("#fp").innerHTML="<option value=''>بدون ملک</option>"+p.map(x=>`<option value=${x.id}>${esc(x.title)}</option>`).join("");$("#flist").innerHTML=f.filter(x=>x.status=="open").map(x=>`<div class=item><b>${esc(x.title)}</b> • ${esc(x.due_at||"")}<br>${esc(x.client_name||"")} ${esc(x.property_title||"")} <button onclick="done(${x.id})">انجام شد</button></div>`).join("")||"پیگیری بازی نیست."}catch(e){}}
async function done(id){await api("/api/followups/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:"done"})});load()}
async function match(){let a=await api("/api/match/"+$("#mc").value);$("#mout").innerHTML=a.map(x=>`<div class=item><span class=score>${x.score}%</span> <b>${esc(x.title)}</b><br>${esc(x.city)} ${esc(x.neighborhood)} • ${x.area||"-"} متر<br>${x.why.map(y=>`<span class=pill>${esc(y)}</span>`).join("")}</div>`).join("")||"تطبیقی پیدا نشد."}
let tm;$("#sq").oninput=()=>{clearTimeout(tm);tm=setTimeout(async()=>{let q=$("#sq").value.trim();if(!q){$("#sout").innerHTML="";return}let a=await api("/api/search?q="+encodeURIComponent(q));$("#sout").innerHTML=a.map(x=>`<div class=item><b>${esc(x.name)}</b> <span class=pill>${x.type}</span><br>${esc(x.city||"")} ${esc(x.neighborhood||"")} ${esc(x.phone||"")}</div>`).join("")||"نتیجه‌ای پیدا نشد."},250)};
boot();
</script></body></html>
