<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b9944a"><link rel="manifest" href="/manifest.json">
<title>AMLAK AI OFFICE</title>

<style>
:root{--bg:#0b0c0e;--panel:#14161a;--panel2:#1a1d22;--line:#2a2e35;--text:#f4f1ea;--muted:#9da3ad;--gold:#c5a15a;--danger:#d75b5b;--ok:#59b889}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#252016 0,#0b0c0e 32%);color:var(--text);font-family:Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
header{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;background:#0b0c0eea;backdrop-filter:blur(14px);z-index:10}.brand{font-weight:900;letter-spacing:1px}.brand span{color:var(--gold)}
nav{display:flex;gap:6px;overflow:auto}nav button,.ghost{background:transparent;color:var(--muted);border:1px solid transparent;padding:9px 12px;border-radius:10px}nav button.active,nav button:hover{color:var(--text);border-color:var(--line);background:var(--panel)}
main{max-width:1300px;margin:auto;padding:24px}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1.1fr .9fr}.cards{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:linear-gradient(145deg,#17191d,#101216);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 12px 35px #0003}.stat .n{font-size:30px;font-weight:900;margin-top:8px}.muted{color:var(--muted);font-size:13px}.gold{color:var(--gold)}
h1{font-size:26px;margin:8px 0 20px}h2{font-size:18px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.btn{border:0;border-radius:11px;padding:10px 15px;background:var(--gold);color:#111;font-weight:800}.btn.dark{background:var(--panel2);border:1px solid var(--line);color:var(--text)}.btn.danger{background:var(--danger);color:#fff}
input,select,textarea{width:100%;background:#0f1114;border:1px solid var(--line);color:var(--text);border-radius:11px;padding:11px;outline:none}textarea{min-height:110px;resize:vertical}label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field{margin-bottom:12px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}
.thumb{width:100%;height:150px;object-fit:cover;border-radius:12px;background:#0b0c0e}.mini{width:64px;height:48px;object-fit:cover;border-radius:8px}.property-card{padding:0;overflow:hidden}.property-card .body{padding:15px}.pill{display:inline-block;border:1px solid var(--line);padding:4px 8px;border-radius:999px;color:var(--muted);font-size:11px;margin:2px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{width:min(430px,100%);padding:28px}.logo{font-size:25px;font-weight:900;margin-bottom:24px}.logo b{color:var(--gold)}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.media-item{position:relative}.media-item img,.media-item video{width:100%;height:100px;object-fit:cover;border-radius:10px}.media-item button{position:absolute;top:4px;left:4px;border:0;background:#000b;color:#fff;border-radius:7px;padding:3px 6px}.primary{outline:2px solid var(--gold)}
#map{height:320px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}.toast{position:fixed;bottom:18px;left:18px;background:#17191d;border:1px solid var(--line);padding:12px 16px;border-radius:12px;z-index:99}
@media(max-width:800px){.stats,.two,.formgrid{grid-template-columns:1fr}header{height:auto;min-height:68px;flex-wrap:wrap;gap:8px;padding:10px}main{padding:14px}nav{width:100%}.brand{width:100%}}
</style>
</head>
<body>
<div id="login" class="login"><div class="card"><div class="logo">AMLAK <b>AI OFFICE</b></div><div class="field"><label>ایمیل مدیر / کاربر</label><input id="email" type="email"></div><div class="field"><label>رمز عبور</label><input id="password" type="password"></div><button class="btn" style="width:100%" onclick="login()">ورود</button><p id="loginMsg" class="muted"></p></div></div>
<div id="app" class="hidden">
<header><div class="brand">AMLAK <span>AI OFFICE</span></div><nav id="nav"></nav><button class="ghost" onclick="logout()">خروج</button></header>
<main id="view"></main>
</div>
<div id="toast" class="toast hidden"></div>
<script>
function loadLeaflet(){return new Promise((res,rej)=>{if(window.L)return res();const l=document.createElement('link');l.rel='stylesheet';l.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(l);const sc=document.createElement('script');sc.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';const t=setTimeout(()=>rej(new Error('timeout')),10000);sc.onload=()=>{clearTimeout(t);res()};sc.onerror=()=>{clearTimeout(t);rej(new Error('load'))};document.head.appendChild(sc)})}
const $=id=>document.getElementById(id);let me=null,types={},props=[],clientsData=[],followupsData=[],map,marker,currentProperty=null;
async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'خطا');return d}
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2800)}
async function boot(){try{me=await api('/api/me');types=await api('/api/property-types');$('login').classList.add('hidden');$('app').classList.remove('hidden');nav();home()}catch{}}
async function login(){try{me=await api('/api/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});types=await api('/api/property-types');$('login').classList.add('hidden');$('app').classList.remove('hidden');nav();home()}catch(e){$('loginMsg').textContent=e.message}}
async function logout(){await api('/api/logout',{method:'POST'});location.reload()}
function nav(){const a=[['home','داشبورد'],['properties','املاک'],['clients','مشتریان'],['followups','پیگیری‌ها']];if(me.role==='admin')a.push(['admin','مدیریت']);$('nav').innerHTML=a.map(x=>`<button onclick="${x[0]}()" id="n-${x[0]}">${x[1]}</button>`).join('')}
function active(id){document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));$('n-'+id)?.classList.add('active')}
async function home(){active('home');const d=await api('/api/dashboard');$('view').innerHTML=`<h1>داشبورد</h1><div class="grid stats">${[['ملک فعال',d.properties],['مشتری',d.clients],['پیگیری باز',d.openFollowups],['عقب‌افتاده',d.overdue]].map(x=>`<div class="card stat"><div class="muted">${x[0]}</div><div class="n">${x[1]}</div></div>`).join('')}</div><div class="grid two" style="margin-top:14px"><div class="card"><h2>مسیر سریع</h2><div class="toolbar"><button class="btn" onclick="propertyForm()">+ ثبت ملک</button><button class="btn dark" onclick="clientForm()">+ ثبت مشتری</button><button class="btn dark" onclick="followupForm()">+ پیگیری</button></div></div><div class="card"><h2>فعالیت اخیر</h2>${d.activities.map(a=>`<p class="muted">${a.user_name} · ${a.action} · ${a.details||''}</p>`).join('')||'<p class="muted">فعالیتی ثبت نشده</p>'}</div></div>`}
async function properties(){active('properties');props=await api('/api/properties');$('view').innerHTML=`<div class="toolbar"><h1 style="margin-left:auto">پرونده املاک</h1><button class="btn" onclick="propertyForm()">+ ثبت ملک</button></div><div class="grid cards">${props.map(p=>{const m=p.media?.find(x=>x.is_primary)||p.media?.[0];return `<div class="card property-card">${m?`<img class="thumb" src="${m.thumb_url||m.url}">`:''}<div class="body"><div class="muted">${p.property_type||p.purpose||''} · ${p.property_subtype||''}</div><h2>${p.title||p.description?.slice(0,40)||'ملک بدون عنوان'}</h2><p>${p.city||''} ${p.neighborhood||''}</p><button class="btn dark" onclick="detail(${p.id})">مشاهده پرونده</button></div></div>`}).join('')}</div>`}
function propertyForm(p=null){const edit=!!p;$('view').innerHTML=`<h1>${edit?'ویرایش ملک':'ثبت سریع ملک'}</h1><div class="card"><div class="formgrid">
<div class="field"><label>کاربری *</label><select id="ptype" onchange="subtypes()"><option value="">انتخاب کنید</option>${Object.keys(types).map(k=>`<option ${p?.property_type===k?'selected':''} value="${k}">${k.replaceAll('_','/')}</option>`).join('')}</select></div>
<div class="field"><label>نوع ملک</label><select id="psub"><option value="">ابتدا کاربری</option></select></div>
<div class="field full"><label>عنوان / توضیح کوتاه</label><input id="title" value="${esc(p?.title)}"></div>
<div class="field full"><label>توضیحات ملک</label><textarea id="desc">${esc(p?.description)}</textarea></div>
<div class="field full"><label>توضیحات مالک</label><textarea id="owner_notes">${esc(p?.owner_notes)}</textarea></div>
<div class="field"><label>نوع معامله</label><select id="deal"><option value="">انتخاب</option><option>فروش</option><option>رهن</option><option>اجاره</option><option>رهن و اجاره</option><option>مشارکت</option></select></div>
<div class="field"><label>متراژ</label><input id="area" type="number" value="${p?.area||''}"></div>
<div class="field"><label>خواب</label><input id="bedrooms" type="number" value="${p?.bedrooms||''}"></div>
<div class="field"><label>طبقه</label><input id="floor" type="number" value="${p?.floor||''}"></div>
<div class="field"><label>سال ساخت</label><input id="build_year" type="number" value="${p?.build_year||''}"></div>
<div class="field"><label>شهر</label><input id="city" value="${esc(p?.city)}"></div><div class="field"><label>محله</label><input id="neighborhood" value="${esc(p?.neighborhood)}"></div>
<div class="field"><label>قیمت</label><input id="price" type="number" value="${p?.price||''}"></div><div class="field"><label>امکانات</label><input id="features" value="${esc(p?.features)}"></div>
<div class="field full"><label>Voice / متن آزاد</label><textarea id="voice">${esc(p?.raw_voice)}</textarea><button class="btn dark" onclick="voice()">🎙️ ضبط فارسی</button> <button class="btn dark" onclick="parseVoice()">AI استخراج اطلاعات</button></div>
<div class="field full"><label>رسانه‌ها — حداقل انتخاب همزمان ۱۰ عکس</label><input id="files" type="file" accept="image/*,video/*" multiple><div id="media" class="media">${renderMedia(p?.media||[])}</div></div>
<div class="field full"><label>موقعیت</label><div id="map"></div><p class="muted">روی نقشه نقطه را انتخاب کنید؛ مختصات دستی لازم نیست.</p></div>
</div><div class="toolbar"><button class="btn" onclick="saveProperty(${edit?p.id:'null'})">ذخیره ملک</button><button class="btn dark" onclick="properties()">انصراف</button></div></div>`;
subtypes(p?.property_subtype);setTimeout(()=>initMap(p),50);$('deal').value=p?.deal||''}
function esc(v){return String(v||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function subtypes(sel=''){const k=$('ptype').value;const arr=types[k]||[];$('psub').innerHTML='<option value="">انتخاب</option>'+arr.map(x=>`<option ${x===sel?'selected':''}>${x}</option>`).join('')}
function renderMedia(ms){return ms.map(m=>`<div class="media-item ${m.is_primary?'primary':''}"><${m.type==='video'?'video controls':'img'} src="${m.thumb_url||m.url}"></${m.type==='video'?'video':'img'}<button onclick="event.stopPropagation();mediaPrimary('${m.id}')">اصلی</button></div>`).join('')}
async function initMap(p){try{await loadLeaflet()}catch{const m=document.getElementById('map');if(m)m.innerHTML='<div class="muted" style="padding:30px">نقشه بارگذاری نشد (اتصال به سرویس نقشه برقرار نیست)</div>';return}map=L.map('map').setView([36.84,54.43],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);if(p?.lat&&p?.lng){marker=L.marker([p.lat,p.lng]).addTo(map);map.setView([p.lat,p.lng],15)}map.on('click',e=>{if(marker)marker.remove();marker=L.marker(e.latlng).addTo(map);marker.bindPopup('موقعیت انتخاب شد').openPopup()})}
async function saveProperty(id){try{const body={title:$('title').value,property_type:$('ptype').value,property_subtype:$('psub').value,description:$('desc').value,owner_notes:$('owner_notes').value,deal:$('deal').value,area:$('area').value,bedrooms:$('bedrooms').value,floor:$('floor').value,build_year:$('build_year').value,city:$('city').value,neighborhood:$('neighborhood').value,price:$('price').value,features:$('features').value,raw_voice:$('voice').value};let r=id?await api('/api/properties/'+id,{method:'PATCH',body:JSON.stringify(body)}):await api('/api/properties',{method:'POST',body:JSON.stringify(body)});const pid=id||r.id;const fs=[...$('files').files];if(fs.length){const fd=new FormData();fs.slice(0,20).forEach(f=>fd.append('files',f));await fetch('/api/properties/'+pid+'/media',{method:'POST',body:fd}).then(async x=>{if(!x.ok)throw new Error((await x.json()).error||'آپلود خطا')})}if(marker)await api('/api/properties/'+pid+'/map',{method:'POST',body:JSON.stringify({lat:marker.getLatLng().lat,lng:marker.getLatLng().lng})});toast('ملک ذخیره شد');properties()}catch(e){toast(e.message)}}
function voice(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('مرورگر شما تشخیص گفتار را پشتیبانی نمی‌کند');const r=new R();r.lang='fa-IR';r.interimResults=false;r.onresult=e=>$('voice').value=($('voice').value+' '+e.results[0][0].transcript).trim();r.start()}
async function parseVoice(){try{const d=await api('/api/ai/property-parse',{method:'POST',body:JSON.stringify({text:$('voice').value})});for(const [k,v] of Object.entries(d.fields||{})){const el=$(k);if(el)el.value=v}if(d.fields.property_type){$('ptype').value=d.fields.property_type;subtypes(d.fields.property_subtype)}toast(d.provider==='ai'?'AI اطلاعات را استخراج کرد':'استخراج پایه انجام شد؛ موارد نامطمئن را بررسی کنید')}catch(e){toast(e.message)}}
async function mediaPrimary(id){try{await api('/api/properties/'+currentProperty.id+'/media',{method:'PATCH',body:JSON.stringify({primary_id:id})});detail(currentProperty.id)}catch(e){toast(e.message)}}
async function detail(id){currentProperty=await api('/api/properties/'+id);const p=currentProperty;active('properties');$('view').innerHTML=`<div class="toolbar"><button class="btn dark" onclick="properties()">← املاک</button><h1>${esc(p.title||p.property_subtype||'پرونده ملک')}</h1></div><div class="grid two"><div class="card"><h2>خلاصه</h2><p>${esc(p.description)}</p><p class="gold">${p.city||''} ${p.neighborhood||''}</p><p>${p.area||'—'} متر · ${p.bedrooms||'—'} خواب · ${p.deal||'—'}</p></div><div class="card"><h2>رسانه</h2><div class="media">${renderMedia(p.media||[])}</div></div></div><div class="card" style="margin-top:14px"><h2>موقعیت</h2><div id="detailmap"></div>${p.map?.google_maps_url?`<p><a class="gold" target="_blank" href="${p.map.google_maps_url}">مشاهده در Google Maps</a></p>`:''}</div><div class="card" style="margin-top:14px"><h2>Virtual Tour</h2><p class="muted">تور استاندارد از رسانه‌های این پرونده آماده است. معماری 360 برای scene/hotspot در همین پرونده ذخیره می‌شود و می‌تواند در مرحله بعد به نمایشگر 360 متصل شود.</p></div>`;if(p.lat&&p.lng){try{await loadLeaflet()}catch{$('detailmap').innerHTML='<div class="muted" style="padding:30px">نقشه بارگذاری نشد</div>';return}const dm=L.map('detailmap').setView([p.lat,p.lng],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(dm);L.marker([p.lat,p.lng]).addTo(dm)}else $('detailmap').innerHTML='<div class="muted" style="padding:30px">موقعیت ثبت نشده</div>'}
async function clients(){active('clients');clientsData=await api('/api/clients');$('view').innerHTML=`<div class="toolbar"><h1 style="margin-left:auto">مشتریان</h1><button class="btn" onclick="clientForm()">+ مشتری</button></div><div class="grid cards">${clientsData.map(c=>`<div class="card"><h2>${esc(c.name)}</h2><p>${esc(c.phone||'')}<br>${esc(c.city||'')} ${esc(c.neighborhood||'')}</p></div>`).join('')}</div>`}
function clientForm(){ $('view').innerHTML=`<h1>ثبت مشتری</h1><div class="card"><div class="formgrid"><div class="field"><label>نام</label><input id="cn"></div><div class="field"><label>تلفن</label><input id="cp"></div><div class="field"><label>شهر</label><input id="cc"></div><div class="field"><label>محله</label><input id="cnb"></div><div class="field"><label>نوع ملک</label><input id="ct"></div><div class="field"><label>بودجه حداقل</label><input id="cb1" type="number"></div><div class="field"><label>بودجه حداکثر</label><input id="cb2" type="number"></div><div class="field"><label>نیازها</label><input id="cm"></div></div><button class="btn" onclick="saveClient()">ذخیره</button></div>`}
async function saveClient(){await api('/api/clients',{method:'POST',body:JSON.stringify({name:$('cn').value,phone:$('cp').value,city:$('cc').value,neighborhood:$('cnb').value,purpose:$('ct').value,min_budget:$('cb1').value,max_budget:$('cb2').value,must_have:$('cm').value})});toast('مشتری ثبت شد');clients()}
async function followups(){active('followups');followupsData=await api('/api/followups');$('view').innerHTML=`<div class="toolbar"><h1 style="margin-left:auto">پیگیری‌ها</h1><button class="btn" onclick="followupForm()">+ پیگیری</button></div><div class="grid cards">${followupsData.map(f=>`<div class="card"><h2>${esc(f.title||'پیگیری')}</h2><p>${f.client_name||''} · ${f.property_title||''}</p><p class="muted">${f.due_at||''} · ${f.status}</p></div>`).join('')}</div>`}
function followupForm(){$('view').innerHTML=`<h1>پیگیری جدید</h1><div class="card"><div class="formgrid"><div class="field"><label>عنوان</label><input id="ft"></div><div class="field"><label>موعد</label><input id="fd" type="datetime-local"></div><div class="field full"><label>یادداشت</label><textarea id="fn"></textarea></div></div><button class="btn" onclick="saveFollow()">ذخیره</button></div>`}
async function saveFollow(){await api('/api/followups',{method:'POST',body:JSON.stringify({title:$('ft').value,due_at:$('fd').value,notes:$('fn').value})});toast('پیگیری ثبت شد');followups()}
async function admin(){active('admin');const staff=await api('/api/staff');$('view').innerHTML=`<h1>مدیریت دفتر</h1><div class="grid two"><div class="card"><h2>پرسنل</h2>${staff.map(s=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)"><span>${esc(s.name)} <small class="muted">${s.role}</small></span><span>${s.active?'فعال':'غیرفعال'}</span></div>`).join('')}</div><div class="card"><h2>Backup</h2><button class="btn" onclick="location='/api/backup'">دریافت پشتیبان JSON</button><p class="muted">قبل از migration و restore نسخه پشتیبان سروری نیز ثبت می‌شود.</p></div></div>`}
boot();
</script>
</body></html>
